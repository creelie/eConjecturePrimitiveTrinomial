name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean certificate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.24.0
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check both files and their axioms
        run: |
          cd lean
          for f in LatticePaths.lean Enumerative.lean; do
            lean "$f" | tee -a out.txt
          done
          test "$(grep -c 'does not depend on any axioms' out.txt)" = 29
          ! grep -q "sorry\|error" out.txt

  julia:
    name: Julia checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Run every script
        run: |
          cd julia
          julia run_all.jl | tee out.txt
          grep -q ", 0 failed" out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-log
          path: julia/out.txt
