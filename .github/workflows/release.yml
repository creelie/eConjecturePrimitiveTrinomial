name: release

# Run by hand from the Actions tab (or the API) after the PR is merged:
# it tags the chosen commit and publishes a GitHub release with the paper
# and the notes in .github/RELEASE_NOTES.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v3.0.0"
        required: true
        default: "v3.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the release files
        run: test -s paper/LatticePathsPaper.pdf
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          gh release create "$TAG" paper/LatticePathsPaper.pdf \
            --target "$TARGET" \
            --title "$TAG: Parity Families of Lattice Paths and Real-Rooted Signed Eulerian Polynomials" \
            --notes-file .github/RELEASE_NOTES.md
